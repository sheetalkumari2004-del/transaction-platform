services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: txn_user
      POSTGRES_PASSWORD: txn_pass
      POSTGRES_DB: txn_platform
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U txn_user -d txn_platform"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - backend

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - backend

  migrate:
    build: .
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    command: ["alembic", "upgrade", "head"]
    networks:
      - backend

  api:
    build: .
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - uploads:/data/uploads
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend

  worker:
    build: .
    env_file: .env
    command: ["python", "-m", "app.workers.import_worker"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - uploads:/data/uploads
    # Separately scalable/deployable from the API, per assignment section
    # 20. Bump `replicas` (or run `docker compose up --scale worker=3`) to
    # add throughput; Streams consumer-group semantics make this safe.
    deploy:
      replicas: 1
    networks:
      - backend

volumes:
  postgres_data:
  redis_data:
  uploads:

networks:
  backend:
